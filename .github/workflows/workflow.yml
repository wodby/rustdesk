name: Build docker image

on:
  push:
    branches:
      - main

    tags:
      - '*'
      - '!*-r[0-9]*'

env:
  RUSTDESK1: '1.1.16'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      rustdesk-versions: ${{ steps.set-matrix.outputs.rustdesk-versions }}
    steps:
      - id: set-matrix
        run: |
          cat << 'EOF' > versions.json
          [
            {"key": "rustdesk1", "version": "${{ env.RUSTDESK1 }}", "latest": "1", "latest_major": "1"}
          ]
          EOF
          echo "rustdesk-versions=$(cat versions.json | jq -c .)" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      matrix:
        rustdesk: ${{ fromJson(needs.setup.outputs.rustdesk-versions) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build and push
        env:
          RUSTDESK_VER: ${{ matrix.rustdesk.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
          make push

  push:
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    strategy:
      matrix:
        rustdesk: ${{ fromJson(needs.setup.outputs.rustdesk-versions) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ matrix.rustdesk.version }}
          latest: ${{ matrix.rustdesk.latest }}
          latest_major: ${{ matrix.rustdesk.latest_major }}
  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@aee656b81ae84e0dca0cfdbea173057abe4a9426
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
