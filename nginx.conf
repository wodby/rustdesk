worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # The route gateway appends the client address to X-Forwarded-For. Taking the last address that isn't
    # private gives the ID server the real client address and ignores addresses a client sends itself.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fc00::/7;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server {
        listen 8080;

        default_type text/plain;

        location = /healthz {
            return 200 "OK\n";
        }

        # hbbs and hbbr trust these headers as the client address, so they are always overwritten.
        location /ws/id {
            proxy_pass http://127.0.0.1:21118;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /ws/relay {
            proxy_pass http://127.0.0.1:21119;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # The open-source server has no API. Clients whose API server points here send status reports,
        # which are refused.
        location /api/ {
            return 404;
        }

        location = / {
            return 200 "RustDesk server\n";
        }

        location / {
            return 404;
        }
    }
}
